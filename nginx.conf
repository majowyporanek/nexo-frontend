server {
    listen 80;
    server_name localhost;

    # 1. Tu serwujemy pliki statyczne frontu
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # 2. TUTAJ NAPRAWIAMY BŁĄD: Przekierowanie ruchu API do backendu
    location /api/ {
        # 'backend' to nazwa usługi z Twojego pliku docker-compose.yml
        proxy_pass http://backend:8080;

        # Przekazywanie nagłówków, żeby backend wiedział skąd leci ruch
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}